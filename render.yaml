# Render Blueprint — one Node service and one Postgres database.
#
# The SPA is served by the same process (server/src/index.js publishes
# index.html, assets/ and the proposal PDF), so there is no separate static
# site and no cross-origin call to configure for the app itself.
#
# Deploy: connect this repository in Render → New → Blueprint. Render reads
# this file, creates the database first, then the service.
#
# Free-tier posture (chosen deliberately for a demonstration):
#   - Free instances have no pre-deploy command and no shell, so the schema and
#     the demonstration board are prepared on the way up: db:migrate is
#     additive and db:seed:demo skips a board that is already on file, so every
#     restart is cheap and never re-seeds.
#   - CORS_ORIGIN stays unset: Render injects RENDER_EXTERNAL_URL and the
#     server's config accepts it as the browser origin.
#   - Free Postgres expires after 30 days; upgrade the database plan when the
#     demo graduates.

databases:
  - name: aurelia-hms-db
    databaseName: aurelia_hms
    user: aurelia
    plan: free
    region: frankfurt

services:
  - type: web
    name: aurelia-hms
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm run db:seed:demo && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aurelia-hms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The seeded dataset is fictional; this deployment exists to show it.
      - key: ALLOW_DEMO_SEED
        value: "true"
